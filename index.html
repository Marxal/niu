<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under Android's gesture bar; the
         nav then adds env(safe-area-inset-bottom) back as padding. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Niu</title>
    <meta name="description" content="Our household organiser: shopping, meals and the calendar." />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />

    <!-- Two theme colours so the Android status bar matches the app in both modes. -->
    <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Niu" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
